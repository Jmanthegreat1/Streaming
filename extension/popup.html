<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --accent:#4f8cff; --bg:#11151d; --panel:#1b212c; --border:#2c3543;
    --text:#f3f5fa; --dim:#94a0b4;
    --good:#3ddc7e; --warn:#f5c451; --idle:#7a8696;
  }
  body { width:300px; margin:0; padding:16px; background:var(--bg); color:var(--text);
    font-family: system-ui, "Segoe UI", sans-serif; font-size:13px; }
  h1 { font-size:15px; margin:0 0 12px; letter-spacing:.2px; }

  /* Big on/off button */
  .power { display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; margin:0 0 10px; padding:15px; border:0; border-radius:12px;
    font:inherit; font-size:16px; font-weight:700; cursor:pointer; transition:.15s; }
  .power .dot { width:12px; height:12px; border-radius:50%; background:var(--idle); transition:.15s; }
  .power.off { background:var(--panel); color:var(--dim); border:1px solid var(--border); }
  .power.on  { background:#16331f; color:#56e08a; box-shadow:inset 0 0 0 1px #2c8a4e; }
  .power.on .dot { background:var(--good); box-shadow:0 0 8px var(--good); }

  /* What's happening right now */
  .status { display:flex; gap:10px; align-items:flex-start; background:var(--panel);
    border:1px solid var(--border); border-radius:10px; padding:11px 12px; margin-bottom:12px; }
  .status .light { flex:none; width:10px; height:10px; border-radius:50%; margin-top:3px;
    background:var(--idle); }
  .status.good .light { background:var(--good); box-shadow:0 0 6px var(--good); }
  .status.warn .light { background:var(--warn); box-shadow:0 0 6px var(--warn); }
  .status .title { font-weight:600; line-height:1.35; }
  .status .sub { color:var(--dim); font-size:12px; line-height:1.45; margin-top:2px; }

  button { font:inherit; cursor:pointer; border-radius:8px; }
  .primary { width:100%; padding:12px; border:0; background:var(--accent); color:#fff;
    font-weight:600; font-size:13px; }
  .primary:hover { filter:brightness(1.08); }
  .hint { font-size:11.5px; color:var(--dim); line-height:1.5; margin:8px 2px 0; }

  .row { display:flex; align-items:center; justify-content:space-between; margin:12px 0 0; gap:10px; }
  .row label { color:var(--dim); }
  select, input[type=text] { background:var(--panel); color:var(--text);
    border:1px solid var(--border); border-radius:8px; padding:8px 10px; font:inherit; }
  select { min-width:132px; }
  input[type=text] { width:100%; box-sizing:border-box; margin-top:5px; }

  details { margin-top:14px; border-top:1px solid #232a37; }
  summary { list-style:none; cursor:pointer; padding:12px 0 2px; color:var(--dim);
    font-weight:600; display:flex; align-items:center; gap:6px; user-select:none; }
  summary::-webkit-details-marker { display:none; }
  summary .chev { transition:.15s; font-size:10px; }
  details[open] summary .chev { transform:rotate(90deg); }
  .field { margin-top:12px; }
  .field > label { display:block; color:var(--dim); font-size:12px; }
  .ghost { width:100%; margin-top:14px; padding:10px; background:var(--panel);
    color:var(--text); border:1px solid var(--border); }
</style>
</head>
<body>
  <h1>Live Subtitle Translator</h1>

  <button id="power" class="power off">
    <span class="dot"></span><span id="powerLabel">Turn ON</span>
  </button>

  <div id="status" class="status">
    <span class="light"></span>
    <div>
      <div class="title" id="statusTitle">Checking…</div>
      <div class="sub" id="statusSub"></div>
    </div>
  </div>

  <button class="primary" id="selectArea">Select subtitle area</button>
  <div class="hint">Play your show, press this, then drag a box over the burned-in
    subtitles. The translation appears right on top of them.</div>

  <div class="row">
    <label for="target">Translate to</label>
    <select id="target"></select>
  </div>

  <details id="advanced">
    <summary><span class="chev">▶</span> Advanced</summary>

    <div class="row">
      <label for="mode">Read subtitles from</label>
      <select id="mode">
        <option value="ocr">The screen (OCR)</option>
        <option value="text">Page text</option>
      </select>
    </div>

    <div class="row" id="engineRow">
      <label for="engine">OCR engine</label>
      <select id="engine">
        <option value="server">Server (free)</option>
        <option value="vision">Google Vision (needs key)</option>
        <option value="local">On this computer</option>
      </select>
    </div>

    <div class="field" id="visionField">
      <label for="visionKey">Google Vision API key</label>
      <input type="text" id="visionKey" placeholder="AIza…" />
    </div>

    <div class="field" id="serverField">
      <label for="backendUrl">Server URL</label>
      <input type="text" id="backendUrl" placeholder="https://…" />
    </div>

    <!-- Page-text mode only -->
    <div id="textControls" style="display:none">
      <button class="ghost" id="teach" style="margin-top:12px">Click to pick the subtitle</button>
      <div class="hint">Press this, then click the subtitle text on the page once.</div>
    </div>

    <button class="ghost" id="clear">Reset subtitle box</button>
  </details>

  <script src="popup.js"></script>
</body>
</html>
